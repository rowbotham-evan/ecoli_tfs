<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/nav.css">
</head>
<body>
  <header class="site-bar">
    <div class="site-bar-inner">
      <p class="site-title"><a href="./">Transcription Factor Database <em>Escherichia coli (E. coli)</em></a></p>
      <nav class="site-tabs" aria-label="Main navigation">
        <a href="./">Database</a>
        <a href="coverage.html">Coverage</a>
        <a href="ingestion.html">Ingestion</a>
        <a href="notes.html" aria-current="page">Notes</a>
      </nav>
      <a class="site-download" href="../data/dataset.csv" download>Download CSV<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8M4.5 6.8 8 10.3l3.5-3.5M2.5 13.5h11"/></svg></a>
    </div>
  </header>
  <main class="notebook">
    <h1>Notes</h1>
    <div id="entries"></div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    // Renders notes.md into the page.
    fetch("../notes.md", { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(md => { document.getElementById("entries").innerHTML = marked.parse(md); })
      .catch(() => { document.getElementById("entries").textContent = "Could not load notes.md."; });
  </script>
  <script>window.WATCH_FILES = ["notes.html", "../notes.md", "../assets/style.css", "../assets/nav.css"];</script>
  <script src="../assets/nav.js"></script>
  <script src="../assets/dev-reload.js"></script>
</body>
</html>
