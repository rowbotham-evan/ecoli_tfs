<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All motifs grid</title>
  <style>
:root { color-scheme: light; --ink: #222222; --muted: #666666; --line: #e5e5e5; --accent: #333333; }
* { box-sizing: border-box; }
body { margin: 0; background: #ffffff; color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1480px; margin: 0 auto; padding: 28px 40px 48px; }
a { color: var(--accent); text-underline-offset: 3px; }
[hidden] { display: none !important; }
.back { margin: 0 0 18px; font-size: 0.85rem; }
h1 { font-size: 2rem; line-height: 1.15; letter-spacing: -0.025em; font-weight: 700; margin: 0 0 8px; }
.intro { margin: 0 0 20px; color: var(--muted); max-width: 86ch; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 14px; padding: 0; list-style: none; color: var(--muted); font-size: 0.78rem; }
.legend li { display: inline-flex; align-items: center; gap: 7px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.tooltip {
  position: absolute; z-index: 3; pointer-events: none; white-space: nowrap; padding: 5px 9px; border-radius: 6px;
  background: #222222; color: #ffffff; font-size: 0.75rem;
}
.status { color: var(--muted); font-size: 0.9rem; }
@media (max-width: 900px) { main { padding: 24px; } }
  </style>
  <link rel="stylesheet" href="../assets/nav.css">
</head>
<body>
  <header class="site-bar">
    <div class="site-bar-inner">
      <p class="site-title"><a href="./">Transcription Factor Database <em>Escherichia coli (E. coli)</em></a></p>
      <nav class="site-tabs" aria-label="Main navigation">
        <a href="./">Database</a>
        <a href="coverage.html">Coverage</a>
        <a href="notes.html">Notes</a>
      </nav>
      <a class="site-download" href="../data/dataset.csv" download>Download CSV<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8M4.5 6.8 8 10.3l3.5-3.5M2.5 13.5h11"/></svg></a>
    </div>
  </header>
  <main>
    <p class="back"><a href="coverage.html#identity">← Back to Coverage</a></p>
    <h1>All motifs: DAP-seq against ChIP-seq</h1>
    <p class="intro" id="intro">Loading…</p>
    <ul class="legend" id="legend"></ul>
    <div class="chart" id="chart"></div>
    <p class="status" id="error" hidden>Could not load <code>data/motif_grid.json</code>. Refresh the page to try again.</p>
  </main>
  <script>
// Every DAP-seq motif (rows) against every ChIP-seq motif (columns), from data/motif_grid.json
// (scripts/build_motif_agreement.py). The TFs with both motifs come first on both axes, so
// their own pairs are the diagonal of the dashed square; the others have one motif only.

// Only strong pairs are drawn, in three steps of one blue; the rest is left blank.
const STEPS = [[0.8, "#0d366b", "0.8 or more"], [0.65, "#3987e5", "0.65 to 0.8"], [0.5, "#b7d3f6", "0.5 to 0.65"]];
const colorOf = v => (STEPS.find(([from]) => v >= from) || [])[1];
const escape = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let data = null;

function render() {
  if (!data) return;
  const { rows, cols, matrix, paired, families } = data;
  const chart = document.getElementById("chart");
  document.getElementById("intro").innerHTML =
    `All <b>${rows.length}</b> DAP-seq motifs (rows) against all <b>${cols.length}</b> ChIP-seq motifs (columns), with the <b>${paired}</b> TFs that have both inside the dashed square, where a TF\u2019s own pair is on the diagonal.`;
  document.getElementById("legend").innerHTML = `<li>Correlation:</li>` +
    [...STEPS].reverse().map(([, color, label]) => `<li><span class="swatch" style="background:${color}"></span>${label}</li>`).join("") +
    `<li><span class="swatch" style="background:#f6f6f4; border: 1px solid #c9c9c9"></span>below ${STEPS[STEPS.length - 1][0]}</li>` +
    `<li><svg width="12" height="12" aria-hidden="true"><rect x="1" y="1" width="10" height="10" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="3 2"/></svg>The ${paired} TFs with both motifs</li>` +
    `<li><svg width="12" height="12" aria-hidden="true"><rect x="1" y="1" width="10" height="10" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></svg>TFs of one protein family</li>`;

  const W = Math.max(600, Math.min(chart.clientWidth || 1200, 1400)), left = 96, top = 96, right = 8;
  const cell = (W - left - right) / cols.length, wide = cell * cols.length, tall = cell * rows.length, H = top + tall + 8;
  const size = Math.min(11, cell * 0.98);
  const parts = [`<rect x="${left}" y="${top}" width="${wide}" height="${tall}" fill="#f6f6f4"/>`];
  matrix.forEach((row, i) => row.forEach((v, j) => {
    const color = colorOf(v);
    if (color) parts.push(`<rect x="${(left + j * cell).toFixed(2)}" y="${(top + i * cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" fill="${color}"/>`);
  }));
  rows.forEach((name, i) => parts.push(`<text x="${left - 5}" y="${top + (i + 0.5) * cell}" text-anchor="end" dominant-baseline="central" font-size="${size}" fill="#333">${escape(name)}</text>`));
  cols.forEach((name, j) => parts.push(`<text transform="translate(${left + (j + 0.5) * cell} ${top - 5}) rotate(-90)" dominant-baseline="central" font-size="${size}" fill="#333">${escape(name)}</text>`));
  // Families of the paired TFs: a frame around each run of relatives on the diagonal.
  for (let i = 0; i < paired;) {
    let j = i;
    while (j + 1 < paired && families[j + 1] && families[j + 1] === families[i]) j++;
    if (families[i] && j > i) parts.push(`<rect x="${left + i * cell - 0.5}" y="${top + i * cell - 0.5}" width="${(j - i + 1) * cell}" height="${(j - i + 1) * cell}" fill="none" stroke="#8a8a8a" stroke-width="1"><title>${escape(families[i])} family</title></rect>`);
    i = j + 1;
  }
  parts.push(`<rect x="${left - 0.5}" y="${top - 0.5}" width="${paired * cell + 1}" height="${paired * cell + 1}" fill="none" stroke="#111" stroke-width="1.25" stroke-dasharray="4 3"/>`);
  parts.push(`<text x="${left + wide / 2}" y="16" text-anchor="middle" font-size="17" font-weight="700" fill="#222">ChIP-seq</text>`);
  parts.push(`<text transform="translate(16 ${top + tall / 2}) rotate(-90)" text-anchor="middle" font-size="17" font-weight="700" fill="#222">DAP-seq</text>`);
  parts.push(`<g id="cross" pointer-events="none"></g>`);
  chart.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Heatmap of the correlation between ${rows.length} DAP-seq motifs and ${cols.length} ChIP-seq motifs">${parts.join("")}</svg><div class="tooltip" hidden></div>`;

  // Pointing at a cell marks its row and column and names the pair.
  const svg = chart.querySelector("svg"), cross = svg.querySelector("#cross"), tip = chart.querySelector(".tooltip");
  svg.addEventListener("mousemove", e => {
    const box = svg.getBoundingClientRect(), k = W / box.width;
    const j = Math.floor(((e.clientX - box.left) * k - left) / cell), i = Math.floor(((e.clientY - box.top) * k - top) / cell);
    if (i < 0 || j < 0 || i >= rows.length || j >= cols.length) { cross.innerHTML = ""; tip.hidden = true; return; }
    cross.innerHTML =
      `<rect x="${left}" y="${top + i * cell}" width="${wide}" height="${cell}" fill="#eb6834" fill-opacity="0.22"/>` +
      `<rect x="${left + j * cell}" y="${top}" width="${cell}" height="${tall}" fill="#eb6834" fill-opacity="0.22"/>` +
      `<rect x="${left + j * cell - 1}" y="${top + i * cell - 1}" width="${cell + 2}" height="${cell + 2}" fill="none" stroke="#111" stroke-width="1.5"/>`;
    tip.textContent = `${rows[i]} (DAP-seq) vs ${cols[j]} (ChIP-seq): ${matrix[i][j].toFixed(2)}${rows[i] === cols[j] ? " · same TF" : ""}`;
    tip.hidden = false;
    const area = chart.getBoundingClientRect();
    let x = e.clientX - area.left + 14;
    if (x + tip.offsetWidth > area.width) x = Math.max(0, x - tip.offsetWidth - 28);
    tip.style.left = `${x}px`;
    tip.style.top = `${e.clientY - area.top - 12}px`;
  });
  svg.addEventListener("mouseleave", () => { cross.innerHTML = ""; tip.hidden = true; });
}

fetch("../data/motif_grid.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(json => { data = json; render(); })
  .catch(() => { document.getElementById("intro").hidden = true; document.getElementById("error").hidden = false; });

let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
  </script>
  <script>window.WATCH_FILES = ["grid.html", "../assets/nav.css", "../data/motif_grid.json"];</script>
  <script src="../assets/nav.js"></script>
  <script src="../assets/dev-reload.js"></script>
</body>
</html>
