<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thoughts</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="notebook">
    <p class="nav"><a href="./">Database</a> · <a href="thoughts.html">Thoughts</a></p>
    <h1>Thoughts</h1>
    <div id="entries"></div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    // Renders thoughts.md into the page.
    fetch("thoughts.md")
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(md => { document.getElementById("entries").innerHTML = marked.parse(md); })
      .catch(() => { document.getElementById("entries").textContent = "Could not load thoughts.md."; });
  </script>
</body>
</html>
